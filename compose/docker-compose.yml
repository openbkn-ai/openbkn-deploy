      REDISWRITEUSER: ""
      REDISWRITEPASS: ""
      # 客户端强制 SASL_PLAINTEXT/PLAIN，只能连 19092
      KAFKAHOST: kafka
      KAFKAPORT: "19092"
      KAFKAUSER: admin
      KAFKAPASS: ${KAFKA_SASL_PASSWORD:-openbkn-kafka}
      METERING_BACKEND: redis
      TEXTVECTORMAPPING: "{}"
      VLMVECTORMAPPING: "{}"
      TEXTRERANKERMAPPING: "{}"
      DM_SVC_PATH: /tmp/rds_conf/
      OAUTHPUBLICHOST: hydra
      OAUTHPUBLICPORT: "4444"
      OAUTHADMINHOST: hydra
      OAUTHADMINPORT: "4445"
      USERMANAGEMENTPUBLICHOST: user-management-public
      USERMANAGEMENTPUBLICPORT: "30980"
      USERMANAGEMENTPRIVATEHOST: user-management-private
      USERMANAGEMENTPRIVATEPORT: "30980"
      LOG_ENABLED: "false"
      TRACE_ENABLED: "false"
      METRIC_ENABLED: "false"
      LOG_EXPORTER: console
      TRACE_PROVIDER: console
      METRIC_PROVIDER: console
      LOG_LOAD_INTERNAL: "10"
      LOG_LOAD_MAX_LOG: "1000"
      TRACE_MAX_QUEUE_SIZE: "50000"
      METRIC_INTERVAL_SECOND: "60"
    expose:
      - "9898"
    volumes:
      - ./config/mf-model-manager/dm_svc.conf:/tmp/rds_conf/dm_svc.conf:ro
    depends_on:
      mariadb:
        condition: service_healthy
      data-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      bkn-safe:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9898/api/v1/health/alive', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - openbkn

  oss-gateway-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/openbkn-ai}/oss-gateway-backend:${OPENBKN_VERSION:-0.2.1}
    container_name: openbkn-oss-gateway-backend
    restart: *restart
    environment:
      <<: *common-env
      DEVICE_CODE: ""
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol-contrib:4318
      LOG_ENABLED: "false"
      TRACE_ENABLED: "false"
      METRIC_ENABLED: "false"
      LOG_EXPORTER: http
      TRACE_PROVIDER: http
      METRIC_PROVIDER: http
      LOG_LOAD_INTERNAL: "10"
      LOG_LOAD_MAX_LOG: "1000"
      TRACE_MAX_QUEUE_SIZE: "50000"
      METRIC_INTERVAL_SECOND: "60"
      RDSHOST: mariadb
      RDSPORT: "3306"
      RDSUSER: root
      RDSPASS: ${MARIADB_ROOT_PASSWORD:-openbkn}
      DB_TYPE: MYSQL
      RDSDBNAME: openbkn
      # 与 chart 一致；用于解开库中已加密的 access key
      CRYPTO_AES_KEY: ${OSS_GATEWAY_AES_KEY:-k8WVs8pfQae0LhUgevDvPXiYPqYZ8HRM}
      OPENSEARCH_HOST: opensearch
      OPENSEARCHREAD: opensearch-read
      OPENSEARCHWRITE: opensearch-write
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: ${OPENSEARCH_PASSWORD:-OpenBKN_Admin123!}
      REDISCLUSTERMODE: standalone
      REDISUSER: ""
      REDISPASS: ""
      REDISHOST: redis
      REDISPORT: "6379"
      REDIS_DB: "2"
      KAFKAHOST: kafka
      KAFKAPORT: "9092"
      KAFKAUSER: ""
      KAFKAPASS: ""
      DM_SVC_PATH: /tmp/rds_conf/
      OAUTHPUBLICHOST: hydra
      OAUTHPUBLICPORT: "4444"
      OAUTHADMINHOST: hydra
      OAUTHADMINPORT: "4445"
    expose:
      - "8080"
    volumes:
      - ./config/oss-gateway-backend/dm_svc.conf:/tmp/rds_conf/dm_svc.conf:ro
    depends_on:
      mariadb:
        condition: service_healthy
      data-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - openbkn

  seed-storage:
    # 在 oss-gateway 中登记默认存储，供 operator 上传技能/文件时解析 storage_id
    image: ${IMAGE_REGISTRY:-ghcr.io/openbkn-ai}/bkn-safe:${OPENBKN_VERSION:-0.2.1}
    container_name: openbkn-seed-storage
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/seed-storage.sh"]
    environment:
      OSS_GATEWAY: http://oss-gateway-backend:8080
      ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-http://localhost:9000}
      INTERNAL_ENDPOINT: http://minio:9000
      BUCKET: openbkn
      ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./init/seed-storage.sh:/scripts/seed-storage.sh:ro
    depends_on:
      oss-gateway-backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - openbkn

  agent-operator-integration:
    image: ${IMAGE_REGISTRY:-ghcr.io/openbkn-ai}/agent-operator-integration:${OPENBKN_VERSION:-0.2.1}
    container_name: openbkn-agent-operator-integration
    restart: *restart
    environment:
      <<: *common-env
      BKN_SAFE_URL: http://bkn-safe:3000
      SKILL_INTERNAL_READ_AUTHZ: shadow
      LOGOUT: stdout
      DB_TYPE: mysql
    expose:
      - "9000"
    volumes:
      - ./config/agent-operator-integration/agent-operator-integration.yaml:/sysvol/config/agent-operator-integration.yaml:ro
      - ./config/agent-operator-integration/mq_config.yaml:/sysvol/config/mq_config.yaml:ro
      - ./config/agent-operator-integration/observability.yaml:/sysvol/config/observability.yaml:ro
      - ./config/agent-operator-integration/agent-operator-integration-secret.yaml:/sysvol/secret/agent-operator-integration-secret.yaml:ro
    depends_on:
      mariadb:
        condition: service_healthy
      data-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
      bkn-safe:
        condition: service_started
      hydra:
        condition: service_started
      vega-backend:
        condition: service_started
      mf-model-api:
        condition: service_started
      mf-model-manager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - openbkn

  agent-retrieval:
    image: ${IMAGE_REGISTRY:-ghcr.io/openbkn-ai}/agent-retrieval:${OPENBKN_VERSION:-0.2.1}
    container_name: openbkn-agent-retrieval
    restart: *restart
    environment:
      <<: *common-env
      LOGOUT: stdout
      LC_ALL: en_US.UTF-8
      EXECUTE_SKILL_ENABLED: "false"
      MCP_METRIC_APP_HTML_URL: ""
      DB_TYPE: mysql
      CONTEXT_LOADER_RESOURCE_FILTER_CHUNK_SIZE: "200"
      PTC_SANDBOX_MCP_URL: http://agent-retrieval:30780/api/agent-retrieval/v1/mcp/
      BKN_TRACE_CORE_URL: http://agent-observability:8081
      BKN_TRACE_INTERACTION_FINISH_TIMEOUT_MS: "5000"
      BKN_TRACE_DURABLE_ANSWER_ENABLED: "false"
      BKN_TRACE_ARTIFACT_ENDPOINT: http://agent-observability:8080/api/agent-observability/v1/evidence/artifacts
      BKN_TRACE_ARTIFACT_TOKEN: ${TRACE_EVIDENCE_INGEST_TOKEN:-change-me-trace-evidence-token}
      BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED: "false"
      POD_ID: agent-retrieval
    expose:
      - "30779"
      - "30780"
    volumes:
      - ./config/agent-retrieval/agent-retrieval.yaml:/sysvol/config/agent-retrieval.yaml:ro
      - ./config/agent-retrieval/observability.yaml:/sysvol/config/observability.yaml:ro
      - ./config/agent-retrieval/agent-retrieval-secret.yaml:/sysvol/secret/agent-retrieval-secret.yaml:ro
    depends_on:
      bkn-backend:
        condition: service_started
      ontology-query:
        condition: service_started
      vega-backend:
        condition: service_started
      agent-operator-integration:
        condition: service_started
      bkn-safe:
        condition: service_started
      hydra:
        condition: service_started
      mf-model-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/30779; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - openbkn
      # 沙箱执行器通过 sandbox_network 回连 30780
      - sandbox_network

  bkn-agent:
    image: ${IMAGE_REGISTRY:-ghcr.io/openbkn-ai}/bkn-agent:${OPENBKN_VERSION:-0.2.1}
    container_name: openbkn-bkn-agent
    restart: *restart
    # 单副本硬约束：进程内保存 one-shot 任务与并发闸门，禁止 --scale
    environment:
      <<: *common-env
      BKN_AGENT_PORT: "30800"
      RDSHOST: mariadb
      RDSPORT: "3306"
      RDSDBNAME: openbkn
      RDSUSER: root
      RDSPASS: ${MARIADB_ROOT_PASSWORD:-openbkn}
      HYDRA_ADMIN_BASE: http://hydra:4445
      BKN_SAFE_BASE: http://bkn-safe:3000/api/safe/v1
      MF_MODEL_API_PRIVATE_BASE: http://mf-model-api:9898/api/private/mf-model-api/v1
      OPERATOR_INTEGRATION_BASE: http://agent-operator-integration:9000/api/agent-operator-integration
      CONTEXT_LOADER_MCP_URL: http://agent-retrieval:30779/api/agent-retrieval/v1/mcp/
      BKN_AGENT_DEFAULT_MODEL: ""
      CHECKPOINTER_BACKEND: mysql
      CHECKPOINTER_ALLOW_RUNTIME_DDL: "false"
      BKN_PROVENANCE_BOOTSTRAP_TOKEN: ${BKN_AGENT_PROVENANCE_TOKEN:-change-me-bkn-agent-provenance-token}
      # base 栈没有 collector，先关闭；启用 trace 栈后再打开
      OTEL_ENABLED: "false"
      OTEL_LOGS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol-contrib:4318
      BKN_TRACE_ARTIFACT_INGEST_URL: http://agent-observability:8080/api/agent-observability/v1/evidence/artifacts
      BKN_TRACE_ARTIFACT_INGEST_TOKEN: ${TRACE_EVIDENCE_INGEST_TOKEN:-change-me-trace-evidence-token}
      # producer 硬编码 SASL_PLAINTEXT/PLAIN，PLAINTEXT broker 下必须关闭
      BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED: "false"
    expose:
      - "30800"
    depends_on:
      mariadb:
        condition: service_healthy
      data-migrator:
        condition: service_completed_successfully
      hydra:
        condition: service_started
      bkn-safe:
        condition: service_started
      mf-model-api:
        condition: service_started
      agent-operator-integration:
        condition: service_started
      agent-retrieval:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:30800/api/v1/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - openbkn

networks:
  openbkn:
    name: openbkn
    driver: bridge
  # sandbox 执行器的 NetworkMode 在代码里硬编码为 sandbox_network，名字不可改
  sandbox_network:
    name: sandbox_network
    driver: bridge

volumes:
  mariadb-data:
  postgres-data:
  redis-data:
  opensearch-data:
  kafka-data:
  minio-data:
  bkn-project-git:
  vega-backend-logs:
