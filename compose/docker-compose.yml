      REDISCLUSTERMODE: standalone
      REDISUSER: ""
      REDISPASS: ""
      REDISHOST: redis
      REDISPORT: "6379"
      # 代码里读写连接分别读 REDISREAD*/REDISWRITE*，默认值是不可达的固定 IP
      REDISREADHOST: redis
      REDISREADPORT: "6379"
      REDISREADUSER: ""
