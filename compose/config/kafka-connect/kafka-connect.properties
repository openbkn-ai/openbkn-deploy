bootstrap.servers=kafka:19092
group.id=connect-cluster

security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
# 与 .env 的 KAFKA_SASL_PASSWORD（默认 openbkn-kafka）一致
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="openbkn-kafka";
# Connect 不会把 worker 级 security.* 传给内嵌 client，需逐组显式声明
producer.security.protocol=SASL_PLAINTEXT
producer.sasl.mechanism=PLAIN
producer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="openbkn-kafka";
consumer.security.protocol=SASL_PLAINTEXT
consumer.sasl.mechanism=PLAIN
consumer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="openbkn-kafka";

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true

offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
config.storage.topic=connect-configs
config.storage.replication.factor=1
status.storage.topic=connect-status
status.storage.replication.factor=1

offset.flush.interval.ms=10000
plugin.path=/usr/share/java
