# OpenBKN Foundry — 本地网关（等价 k8s Ingress）
#
# 所有业务服务不映射宿主端口，统一由本网关按路径前缀转发。
# 前缀与各 chart 的 ingress.path 保持一致。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker 内置 DNS，避免后端容器重建后 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 500m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # bkn-safe（认证/授权）
        location /api/safe/ {
            set $upstream bkn-safe;
            proxy_pass http://$upstream:3000;
        }

        # Hydra 的 URLS_LOGIN / URLS_CONSENT / URLS_DEVICE_VERIFICATION 指向
        # 网关同源路径，由 bkn-safe 提供页面（/login/assets/* 也在该前缀下）。
        location /login {
            set $upstream bkn-safe;
            proxy_pass http://$upstream:3000;
        }
        location /consent {
            set $upstream bkn-safe;
            proxy_pass http://$upstream:3000;
        }
        location /device {
            set $upstream bkn-safe;
            proxy_pass http://$upstream:3000;
        }

        # Hydra OAuth2（authorize/token/introspect/public JWKS）
        location /.well-known/ {
            set $upstream hydra;
            proxy_pass http://$upstream:4444;
        }
        location /oauth2/ {
            set $upstream hydra;
            proxy_pass http://$upstream:4444;
        }
        location /userinfo {
            set $upstream hydra;
            proxy_pass http://$upstream:4444;
        }

        location /api/bkn-backend/ {
            set $upstream bkn-backend;
            proxy_pass http://$upstream:13014;
        }

        location /api/bkn-project/ {
            set $upstream bkn-project;
            proxy_pass http://$upstream:13016;
        }

        location /api/ontology-query/ {
            set $upstream ontology-query;
            proxy_pass http://$upstream:13018;
        }

        location /api/vega-backend/ {
            set $upstream vega-backend;
            proxy_pass http://$upstream:13014;
        }

        location /api/agent-operator-integration/ {
            set $upstream agent-operator-integration;
            proxy_pass http://$upstream:9000;
        }

        location /api/agent-retrieval/ {
            set $upstream agent-retrieval;
            proxy_pass http://$upstream:30779;
        }

        location /api/mf-model-api/ {
            set $upstream mf-model-api;
            proxy_pass http://$upstream:9898;
        }

        location /api/private/mf-model-api/ {
            set $upstream mf-model-api;
            proxy_pass http://$upstream:9898;
        }

        location /api/mf-model-manager/ {
            set $upstream mf-model-manager;
            proxy_pass http://$upstream:9898;
        }

        # 服务内部路由是 /api/v1；对外沿用 chart 的前缀命名
        location /api/oss-gateway-backend/ {
            set $upstream oss-gateway-backend;
            rewrite ^/api/oss-gateway-backend/(.*)$ /api/v1/$1 break;
            proxy_pass http://$upstream:8080;
        }

        location /api/bkn-agent/ {
            set $upstream bkn-agent;
            proxy_pass http://$upstream:30800;
        }

        # 未匹配路径不落默认后端
        location / {
            add_header Content-Type application/json always;
            return 404 '{"error":"not_found","hint":"unknown path prefix"}';
        }
    }
}
