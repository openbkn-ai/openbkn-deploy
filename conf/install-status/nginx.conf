server {
  listen 80;
  server_name _;

  # Human-facing dashboard.
  location = /install-status {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    alias /web/index.html;
  }

  # Admin-token-gated status snapshot (the dashboard fetches this).
  # Prefer the in-cluster live merge (refresher's merge.py: real image tags,
  # fresh generatedAt); fall back to the publish-time static snapshot when the
  # refresher is down — its stale generatedAt then trips the dashboard banner,
  # which doubles as the refresher-outage alert.
  location = /install-status.json {
    auth_request /_install_status_auth;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    root /;
    try_files /live/install-status.live.json /data/install-status.json =404;
  }

  # These routes expose only allowlisted fields and also require an admin token.
  # The raw Kubernetes objects stay on the pod's shared volume.
  location = /install-status.pods.json {
    auth_request /_install_status_auth;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    alias /live/pods.public.json;
  }

  # Allowlisted workload readiness summary.
  location = /install-status.workloads.json {
    auth_request /_install_status_auth;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    alias /live/workloads.public.json;
  }

  location = /install-status.events.json {
    auth_request /_install_status_auth;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    alias /live/events.public.json;
  }

  # Every data endpoint is gated by the same bkn-safe-backed admin check.
  # The check subrequest is internal and forwards only the caller's Bearer token.
  location = /_install_status_auth {
    internal;
    proxy_pass http://127.0.0.1:8081/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }

  # The bounded log route shares the dashboard's Bearer-token authorization.
  location = /install-status/logs {
    auth_request /_install_status_auth;
    auth_request_set $install_status_user $upstream_http_x_authenticated_user;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_set_header Authorization "";
    proxy_set_header X-Authenticated-User $install_status_user;
    proxy_pass http://127.0.0.1:8081;
  }

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }
}
