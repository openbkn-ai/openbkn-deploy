name: Audit installer regressions
on:
  pull_request:
    paths: ['deploy.sh', 'scripts/**', '.github/workflows/ci-audit-install.yml']
  push:
    branches: [main]
    paths: ['deploy.sh', 'scripts/**', '.github/workflows/ci-audit-install.yml']
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FOUNDRY_ROOT: /tmp/no-foundry-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - name: Syntax and helper tests (no Kubernetes access)
        run: |
          bash -n deploy.sh scripts/services/openbkn.sh
          PYTHONPATH=scripts/lib python3 -m unittest test_audit_consumer test_audit_helm_render audit_kafka_topic_job_test
          python3 scripts/lib/trace_kafka_topic_job_test.py
      - name: Installer regression tests (mock cluster)
        run: |
          bash scripts/services/openbkn_audit_consumer_test.sh
          bash scripts/services/openbkn_trace_control_test.sh
          bash scripts/services/openbkn_trace_profile_test.sh
          bash scripts/services/openbkn_trace_prerequisites_test.sh
          bash scripts/services/openbkn_trace_topic_test.sh
