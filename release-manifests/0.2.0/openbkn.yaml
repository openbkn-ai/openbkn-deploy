# Release lockfile for OpenBKN 0.2.0.
# Consumed by: deploy.sh openbkn install --version=0.2.0
# Each component must publish its exact 0.2.0 Chart before release installation.
apiVersion: deploy.openbkn.ai/v1alpha1
kind: VersionSet
product: bkn-foundry
version: 0.2.0
source:
  type: oci
  registry: oci://ghcr.io/openbkn-ai/charts
releases:
  core-data-migrator:
    chart: core-data-migrator
    version: 0.2.0
    stage: pre
  bkn-safe:
    chart: bkn-safe
    version: 0.2.0
  mf-model-manager:
    chart: mf-model-manager
    version: 0.2.0
  mf-model-api:
    chart: mf-model-api
    version: 0.2.0
  # Installed before every Evidence producer. The producers deliver trace
  # envelopes to agent-observability, and each release relaxes the owner
  # contract in lockstep: a producer that ships ahead of agent-observability
  # sends an envelope the older consumer still rejects, which parks the outbox
  # in retry and blocks the stream head until the consumer catches up. Consumer
  # first is the only ordering that has no such window.
  agent-observability:
    chart: agent-observability
    version: 0.2.0
  vega-backend:
    chart: vega-backend
    version: 0.2.0
  bkn-backend:
    chart: bkn-backend
    version: 0.2.0
  ontology-query:
    chart: ontology-query
    version: 0.2.0
  agent-operator-integration:
    chart: agent-operator-integration
    version: 0.2.0
  oss-gateway-backend:
    chart: oss-gateway-backend
    version: 0.2.0
  sandbox:
    chart: sandbox
    version: 0.2.0
  agent-retrieval:
    chart: agent-retrieval
    version: 0.2.0
  bkn-agent:
    chart: bkn-agent
    version: 0.2.0
  otelcol-contrib:
    chart: otelcol-contrib
    version: 0.2.0
  bkn-studio:
    chart: bkn-studio
    version: 0.2.0
  # Studio sample catalog, published from openbkn-ai/bkn-samples.
  bkn-sample-studio:
    chart: bkn-sample-studio
    version: 0.2.0
